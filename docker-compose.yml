# Local demo: Kafka + two "pods". Each pod is ONE container running the Java app
# and the Go sidecar together (see Dockerfile / start.sh).
#
#   pod1:  java -> laptop:8080   sidecar -> laptop:8090
#   pod2:  java -> laptop:8081   sidecar -> laptop:8091
#
# Run:  cp /path/to/your-app.jar ./app.jar && docker compose up --build

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Creates the topic once Kafka is up; the pods wait until this succeeds.
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic cache-refresh
      interval: 5s
      timeout: 20s
      retries: 20

  pod1:
    build: .
    image: cache-refresh-demo:latest
    container_name: pod1
    ports:
      - "8080:8080" # java app
      - "8090:8090" # sidecar
    environment:
      POD_NAME: pod-1
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: cache-refresh
      REFRESH_URL: ${REFRESH_URL:-http://localhost:8080/cache/refresh}
    depends_on:
      kafka:
        condition: service_healthy

  pod2:
    build: .
    image: cache-refresh-demo:latest
    container_name: pod2
    ports:
      - "8081:8080" # java app
      - "8091:8090" # sidecar
    environment:
      POD_NAME: pod-2
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: cache-refresh
      REFRESH_URL: ${REFRESH_URL:-http://localhost:8080/cache/refresh}
    depends_on:
      kafka:
        condition: service_healthy
